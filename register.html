<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกใบสมัครเข้าเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; } </style>
</head>
<body class="py-8 px-4">
    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl overflow-hidden border-t-8 border-orange-500">
        
        <div class="p-8 text-center border-b">
            <h1 class="text-3xl font-bold text-gray-800">ฟอร์มลงทะเบียนสมัครเรียน</h1>
            <p class="text-gray-500 mt-2">กรุณากรอกข้อมูลให้ครบถ้วนและเตรียมไฟล์เอกสารให้พร้อม</p>
        </div>

        <form onsubmit="handleRegister(event)" class="p-8">
            <!-- 1. ล็อกอิน -->
            <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-100 pb-2 mb-4">1. ข้อมูลสำหรับเข้าสู่ระบบ (ห้ามลืม)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div><label class="block font-bold text-gray-700 mb-1">เลขประจำตัวประชาชน 13 หลัก *</label><input type="text" id="reg_id" maxlength="13" class="w-full border-2 rounded-lg p-3 bg-gray-50" required></div>
                <div><label class="block font-bold text-gray-700 mb-1">ตั้งรหัสผ่าน *</label><input type="password" id="reg_pass" class="w-full border-2 rounded-lg p-3 bg-gray-50" required></div>
            </div>

            <!-- 2. ข้อมูลส่วนตัว -->
            <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-100 pb-2 mb-4">2. ข้อมูลส่วนตัวและการศึกษา</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div><label class="block font-bold text-gray-700 mb-1">ชื่อจริง *</label><input type="text" id="reg_first" class="w-full border-2 rounded-lg p-3" required></div>
                <div><label class="block font-bold text-gray-700 mb-1">นามสกุล *</label><input type="text" id="reg_last" class="w-full border-2 rounded-lg p-3" required></div>
                <div><label class="block font-bold text-gray-700 mb-1">จบจากโรงเรียน *</label><input type="text" id="reg_school" class="w-full border-2 rounded-lg p-3" required></div>
                <div><label class="block font-bold text-gray-700 mb-1">แผนการเรียนที่สมัคร *</label>
                    <select id="reg_program" class="w-full border-2 rounded-lg p-3" required>
                        <option value="">-- เลือกแผนการเรียน --</option>
                        <option value="วิทยาศาสตร์-คณิตศาสตร์">วิทยาศาสตร์-คณิตศาสตร์</option>
                        <option value="ศิลป์-คำนวณ">ศิลป์-คำนวณ</option>
                    </select>
                </div>
            </div>

            <!-- 3. อัปโหลด -->
            <h2 class="text-xl font-bold text-blue-800 border-b-2 border-blue-100 pb-2 mb-4">3. อัปโหลดหลักฐานประกอบการสมัคร</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="border-2 border-dashed border-blue-300 p-6 text-center rounded-xl bg-blue-50 hover:bg-blue-100 transition">
                    <label class="block font-bold text-blue-800 cursor-pointer">📸 รูปถ่ายนักเรียน<input type="file" id="file_photo" accept="image/*" class="hidden" required onchange="showName('file_photo', 'name_photo')"></label>
                    <p id="name_photo" class="text-sm mt-3 text-gray-600">คลิกเพื่อเลือกไฟล์</p>
                </div>
                <div class="border-2 border-dashed border-blue-300 p-6 text-center rounded-xl bg-blue-50 hover:bg-blue-100 transition">
                    <label class="block font-bold text-blue-800 cursor-pointer">📄 เอกสาร ปพ.1<input type="file" id="file_doc" accept=".pdf,image/*" class="hidden" required onchange="showName('file_doc', 'name_doc')"></label>
                    <p id="name_doc" class="text-sm mt-3 text-gray-600">คลิกเพื่อเลือกไฟล์</p>
                </div>
                <div class="border-2 border-dashed border-green-400 p-6 text-center rounded-xl bg-green-50 hover:bg-green-100 transition">
                    <label class="block font-bold text-green-700 cursor-pointer">💰 สลิปโอนเงิน<input type="file" id="file_slip" accept="image/*" class="hidden" required onchange="showName('file_slip', 'name_slip')"></label>
                    <p id="name_slip" class="text-sm mt-3 text-gray-600">คลิกเพื่อเลือกไฟล์</p>
                </div>
            </div>

            <button type="submit" id="btnReg" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-xl text-xl shadow-xl transition">
                ยืนยันการสมัครและบันทึกข้อมูล
            </button>
            <div class="text-center mt-6">
                <a href="index.html" class="text-gray-500 hover:text-gray-800 underline font-bold">กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
        </form>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzcu3EDBdrpr9Tk6BaIB0ruXgGoJTH10byR1Mhha4ax7DLlaAOm6-kgZl3LfQTRvT0EeQ/exec';

        function showName(inputId, spanId) {
            const input = document.getElementById(inputId);
            if (input.files.length > 0) document.getElementById(spanId).innerHTML = `<span class="text-green-600 font-bold">✅ ${input.files[0].name}</span>`;
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            btn.innerHTML = "⏳ กำลังอัปโหลดข้อมูล (ห้ามปิดหน้าต่างนี้เด็ดขาด)..."; btn.disabled = true;
            btn.classList.add('opacity-70');

            try {
                const pBase64 = await getBase64(document.getElementById('file_photo').files[0]);
                const dBase64 = await getBase64(document.getElementById('file_doc').files[0]);
                const sBase64 = await getBase64(document.getElementById('file_slip').files[0]);

                const payload = {
                    action: "register",
                    national_id: document.getElementById('reg_id').value,
                    password: document.getElementById('reg_pass').value,
                    firstname: document.getElementById('reg_first').value,
                    lastname: document.getElementById('reg_last').value,
                    old_school: document.getElementById('reg_school').value,
                    program: document.getElementById('reg_program').value,
                    photoBase64: pBase64, photoMime: document.getElementById('file_photo').files[0].type,
                    docBase64: dBase64, docMime: document.getElementById('file_doc').files[0].type,
                    slipBase64: sBase64, slipMime: document.getElementById('file_slip').files[0].type
                };

                const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const data = await response.json();

                if(data.status === "success") {
                    alert("🎉 สมัครสำเร็จ! ระบบจะพาคุณกลับไปหน้าเข้าสู่ระบบเพื่อพิมพ์ใบสมัคร");
                    window.location.href = 'index.html';
                } else { 
                    alert("❌ " + data.message); 
                    btn.innerHTML = "ยืนยันการสมัครและบันทึกข้อมูล"; btn.disabled = false; btn.classList.remove('opacity-70');
                }
            } catch (err) { 
                alert("เครือข่ายขัดข้อง กรุณาลองใหม่"); 
                btn.innerHTML = "ยืนยันการสมัครและบันทึกข้อมูล"; btn.disabled = false; btn.classList.remove('opacity-70');
            }
        }
    </script>
</body>
</html>
