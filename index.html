<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; } </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-xl overflow-hidden">
        <div class="bg-blue-800 p-6 text-center text-white font-bold text-xl">ระบบรับสมัคร (จำลอง)</div>
        
        <div class="p-8" id="loginBox">
            <form onsubmit="doLogin(event)">
                <label class="block text-sm font-bold mb-1">เลขบัตรประชาชน 13 หลัก</label>
                <input type="text" id="log_id" class="w-full border p-2 rounded mb-4" required>
                <label class="block text-sm font-bold mb-1">รหัสผ่าน</label>
                <input type="password" id="log_pass" class="w-full border p-2 rounded mb-6" required>
                <button type="submit" id="btnLog" class="w-full bg-blue-700 text-white font-bold py-2 rounded">เข้าสู่ระบบ</button>
            </form>
            <p class="text-center mt-4 text-sm">ยังไม่มีบัญชี? <a href="register.html" class="text-blue-600 font-bold">ลงทะเบียนที่นี่</a></p>
        </div>

        <div class="p-8 hidden" id="dashBox">
            <h2 class="text-green-600 font-bold text-xl text-center mb-4">เข้าสู่ระบบสำเร็จ</h2>
            <p>ชื่อ: <span id="s_name" class="font-bold"></span></p>
            <p>แผนการเรียน: <span id="s_program" class="font-bold"></span></p>
            <p class="mt-4 text-orange-600 font-bold">สถานะ: <span id="s_status"></span></p>
            <button onclick="location.reload()" class="w-full bg-red-500 text-white py-2 rounded mt-6">ออก</button>
        </div>
    </div>

    <script>
        // 🚨🚨 เอาลิงก์จากด่านที่ 1 มาวางในเครื่องหมายคำพูดด้านล่างนี้ 🚨🚨
        const API_URL = 'https://script.google.com/macros/s/AKfycbzcu3EDBdrpr9Tk6BaIB0ruXgGoJTH10byR1Mhha4ax7DLlaAOm6-kgZl3LfQTRvT0EeQ/exec';

        function doLogin(e) {
            e.preventDefault();
            document.getElementById('btnLog').innerText = "รอสักครู่...";
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", national_id: document.getElementById('log_id').value, password: document.getElementById('log_pass').value }),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            }).then(r => r.json()).then(data => {
                if(data.status === "success") {
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('dashBox').classList.remove('hidden');
                    document.getElementById('s_name').innerText = data.data.name;
                    document.getElementById('s_program').innerText = data.data.program;
                    document.getElementById('s_status').innerText = data.data.status;
                } else { alert(data.message); document.getElementById('btnLog').innerText = "เข้าสู่ระบบ"; }
            });
        }
    </script>
</body>
</html>
